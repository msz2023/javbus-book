# 推送 v* 标签时在 GitHub 的 Windows 机器上打包便携版 exe，并自动挂到 Releases。
# 手动触发（workflow_dispatch）只产出构件，不建 Release。
name: Build Windows portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build & package (portable exe)
        run: npm run pack
        env:
          # 不做代码签名，避免 electron-builder 去拉 winCodeSign
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: JavBus-Desktop-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
